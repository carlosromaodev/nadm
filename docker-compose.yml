services:
  postgres:
    image: postgres:16-alpine
    container_name: nadm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nadm
      POSTGRES_PASSWORD: nadm
      POSTGRES_DB: nadm
    ports:
      - '5436:5432'
    volumes:
      - nadm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nadm -d nadm']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nadm_pgdata:
